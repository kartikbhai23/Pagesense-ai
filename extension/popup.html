<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat With This Page</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-bg: #1e293b;
            --answer-bg: #0b1329;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 360px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 6px;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .tab-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 12px;
        }

        .tab-box-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        #page-title {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .input-group {
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        button {
            width: 100%;
            padding: 10px 16px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
        }

        button:active:not(:disabled) {
            transform: scale(0.99);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        #answer {
            margin-top: 8px;
            padding: 12px;
            background: var(--answer-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
            max-height: 280px;
            overflow-y: auto;
            display: none;
        }

        #answer:not(:empty) {
            display: block;
        }

        #answer strong {
            color: #60a5fa;
            font-weight: 700;
        }

        #answer em {
            color: #93c5fd;
            font-style: italic;
        }

        #answer code {
            background: #1e293b;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #f1f5f9;
        }

        #answer ul {
            margin: 6px 0 6px 18px;
            padding: 0;
        }

        #answer li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">✦</div>
        <h3>Chat With This Page</h3>
    </div>

    <div class="tab-box">
        <div class="tab-box-label">Current Page</div>
        <div id="page-title">Loading active tab...</div>
    </div>

    <div class="input-group">
        <input
            type="text"
            id="question"
            placeholder="Ask a question about this page..."
            autocomplete="off"
        >
    </div>

    <button id="ask-button">Ask Gemini</button>

    <p id="status"></p>
    <div id="answer"></div>

    <script src="popup.js"></script>
</body>
</html>
